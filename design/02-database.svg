<text x="405" y="125">_id</text><text x="405" y="147">title, subject</text><text x="405" y="169">description</text><text x="405" y="191">tutorId → User</text><text x="405" y="213">students[] → User</text><text x="405" y="235">classCode</text>
<rect x="740" y="70" width="210" height="160" rx="8" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="740" y="70" width="210" height="32" rx="8" fill="#16a34a"/><text x="845" y="92" text-anchor="middle" fill="#fff" font-weight="bold">Session</text>
