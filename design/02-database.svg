<text x="405" y="375">_id</text><text x="405" y="397">classId → Class</text><text x="405" y="419">title, description</text><text x="405" y="441">dueDate, maxMarks</text><text x="405" y="463">attachmentUrl</text>
<rect x="40" y="320" width="210" height="180" rx="8" fill="#fff" stroke="#d97706" stroke-width="2"/><rect x="40" y="320" width="210" height="32" rx="8" fill="#d97706"/><text x="145" y="342" text-anchor="middle" fill="#fff" font-weight="bold">Submission</text>
<text x="55" y="375">_id</text><text x="55" y="397">assignmentId → Assignment</text><text x="55" y="419">studentId → User</text><text x="55" y="441">fileUrl, submittedAt</text><text x="55" y="463">grade, feedback</text>
<rect x="740" y="470" width="210" height="130" rx="8" fill="#fff" stroke="#db2777" stroke-width="2"/><rect x="740" y="470" width="210" height="32" rx="8" fill="#db2777"/><text x="845" y="492" text-anchor="middle" fill="#fff" font-weight="bold">Message</text>
<text x="755" y="525">_id</text><text x="755" y="547">classId → Class</text><text x="755" y="569">senderId → User, text, time</text>
