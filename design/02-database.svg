<rect x="740" y="290" width="210" height="140" rx="8" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="740" y="290" width="210" height="32" rx="8" fill="#16a34a"/><text x="845" y="312" text-anchor="middle" fill="#fff" font-weight="bold">Material</text>
