<text x="55" y="125">_id</text><text x="55" y="147">name, email</text><text x="55" y="169">password (hashed)</text><text x="55" y="191">role: student|tutor|admin</text><text x="55" y="213">avatar, bio, subjects[]</text><text x="55" y="235">createdAt</text>
